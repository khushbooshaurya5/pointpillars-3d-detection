[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pointpillars"
version = "0.1.0"
description = "Compact PointPillars 3D object detection on KITTI"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["torch", "numpy", "pyyaml", "pillow"]

[tool.setuptools.packages.find]
where = ["src"]
